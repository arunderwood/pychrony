# Docker Compose for local testing
# Requires: git submodule update --init vendor/libchrony

services:
  # Run all tests (unit + integration + contract)
  test-all:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
      cache_from:
        - type=local,src=.docker-cache
    command: >
      sh -c "chronyd && sleep 2 && pytest tests/ -v --tb=short"
    # Mounting host src/ here shadows the compiled _cffi_bindings*.so the image
    # builds into /app/src/pychrony/_core/, silently skipping every test that
    # needs libchrony. Rebuild the image to pick up source changes.
    volumes:
      - ../tests:/app/tests:ro
    cap_add:
      - SYS_TIME

  # Run only unit tests (no chronyd needed)
  test-unit:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
      cache_from:
        - type=local,src=.docker-cache
    command: pytest tests/unit tests/contract -v --tb=short
    volumes:
      - ../src:/app/src:ro
      - ../tests:/app/tests:ro
    environment:
      - PYTHONPATH=/app/src

  # Run only integration tests (requires chronyd)
  test-integration:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
      cache_from:
        - type=local,src=.docker-cache
    command: >
      sh -c "chronyd && sleep 2 && pytest tests/integration -v --tb=short"
    # Host src/ must not be mounted here - see test-all.
    volumes:
      - ../tests:/app/tests:ro
    cap_add:
      - SYS_TIME

  # Interactive development shell with chronyd running
  dev-shell:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
      cache_from:
        - type=local,src=.docker-cache
    command: >
      sh -c "chronyd && sleep 2 && /bin/bash"
    stdin_open: true
    tty: true
    # Host src/ must not be mounted here - see test-all. It would leave libchrony
    # unreachable from the shell, the one thing this shell exists to poke at.
    volumes:
      - ../tests:/app/tests
    cap_add:
      - SYS_TIME
