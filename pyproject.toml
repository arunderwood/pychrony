[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "cffi>=1.14.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pychrony"
dynamic = ["version"]
description = "Python bindings for chrony NTP client"
readme = "README.md"
license = "MIT AND LGPL-2.1-or-later"
license-files = ["LICENSE", "LICENSES/*"]
requires-python = ">=3.11"
authors = [
    {name = "arunderwood", email = "arunderwood@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Networking :: Time Synchronization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "cffi>=1.14.0",
]

[project.urls]
Homepage = "https://github.com/arunderwood/pychrony"
Documentation = "https://pychrony.org/"
Repository = "https://github.com/arunderwood/pychrony.git"
Issues = "https://github.com/arunderwood/pychrony/issues"

[project.entry-points.pytest11]
pychrony = "pychrony.testing"

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"

[tool.setuptools.packages.find]
where = ["src"]

# Typing files. setuptools 69+ ships these by default; the build floor is 61.
# _cffi_bindings.pyi types the CFFI extension, which only exists once built.
[tool.setuptools.package-data]
pychrony = ["py.typed", "_core/*.pyi"]

[tool.ruff]
line-length = 88
target-version = "py311"
# specs/ holds frozen spec-kit design documents; they are historical records and
# are not kept in sync with the code, so exclude them from linting/formatting.
extend-exclude = ["specs/"]

[tool.ruff.lint]
ignore = [
    # __all__ entries are grouped by category (enums, models, exceptions) with
    # explanatory comments; alphabetical sorting would destroy that structure.
    "RUF022",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]

[tool.cibuildwheel]
build-frontend = "build[uv]"
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
environment = { CIBUILDWHEEL = "1" }
test-requires = "pytest"
test-command = "python -m pytest {project}/tests/unit {project}/tests/contract -v"

[[tool.cibuildwheel.overrides]]
select = "*-manylinux_*"
before-all = """
dnf install -y gcc make libtool libffi-devel && \
cd vendor/libchrony && make && make install prefix=/usr && ldconfig
"""

[[tool.cibuildwheel.overrides]]
select = "*-musllinux_*"
before-all = """
apk add --no-cache gcc make libtool libffi-dev musl-dev && \
cd vendor/libchrony && make && make install prefix=/usr
"""

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0.3",
    "ruff>=0.14.11",
    "ty>=0.0.1",
]
docs = [
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
    "mike>=2.0.0",
]
