name: CI

# pull_request has no branches filter: it matches the base branch, so a PR
# stacked on another PR's branch would get no checks at all.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR obsoletes the run before it. Runs on main are never
# cancelled, so every commit there gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Unit, contract, and import tests across every supported interpreter.
  # Keep this matrix in sync with the classifiers and the cibuildwheel
  # `build` allowlist in pyproject.toml, and with release.yml.
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest --cov=src --cov-report=xml

  # Lint and type checking. Results do not vary by interpreter, so this
  # runs once rather than once per matrix entry.
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run type checking
        run: uv run ty check src/

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group docs

      # docs.yml deploys straight to gh-pages on main, so this is the only
      # chance to catch a broken docs build before it becomes a failed publish.
      # --strict promotes broken links and mkdocstrings resolution failures
      # (which would otherwise render an empty API page) into hard errors.
      - name: Build documentation
        run: uv run mkdocs build --strict

  # Full suite in Docker with libchrony - the only place integration
  # tests run against a live chronyd.
  docker-tests:
    name: Integration tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.test
          tags: pychrony-test:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # chronyd answers commands before it has resolved its pool and server
      # names, and the source list grows as each name resolves. Tests that
      # walk the source list race that growth, so wait until no source has an
      # unresolved address. chronyc also fails until the command socket is up.
      - name: Run tests
        run: |
          docker run --rm --cap-add=SYS_TIME pychrony-test:latest sh -c '
            chronyd
            i=0
            until chronyc -n activity 2>/dev/null | grep -q "^0 sources with unknown address"; do
              i=$((i + 1))
              if [ "$i" -ge 40 ]; then
                echo "chronyd sources not resolved after 20s"
                chronyc -n activity
                exit 1
              fi
              sleep 0.5
            done
            echo "chronyd sources resolved after $i polls"
            pytest tests/ -v --tb=short
          '
