name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Required for hatch-vcs versioning
        submodules: recursive  # Required for vendor/libchrony
        persist-credentials: false

    - name: Build wheels with cibuildwheel
      uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
      with:
        extras: uv
      env:
        CIBW_ARCHS_LINUX: ${{ matrix.arch }}

    - name: Upload wheel artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wheels-${{ matrix.arch }}
        path: wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Required for hatch-vcs versioning
        persist-credentials: false

    - name: Install UV
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        # The sdist ships to PyPI, so it must not build from a cache that a PR
        # run could have written.
        enable-cache: false

    - name: Build sdist
      run: uv build --sdist

    - name: Upload sdist artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sdist
        path: dist/*.tar.gz

  publish-testpypi:
    name: Publish to Test PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: dist/
        merge-multiple: true

    - name: Publish to Test PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify Test PyPI (${{ matrix.python }})
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.15"]

    steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python }}
        allow-prereleases: true

    - name: Extract version from tag
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Install from Test PyPI
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # --no-cache-dir is load-bearing. The simple index is served with
        # `cache-control: max-age=600`, so pip stores the first response for ten
        # minutes; without this flag every later attempt replays the same stale
        # index from disk and the retry loop cannot outlast Test PyPI's CDN lag.
        for i in $(seq 1 10); do
          if pip install --no-cache-dir \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "pychrony==$VERSION"; then
            echo "Installed on attempt $i"
            exit 0
          fi
          if [ "$i" -lt 10 ]; then
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          fi
        done
        echo "::error::pychrony==$VERSION never became installable from Test PyPI"
        exit 1

    - name: Verify import and version
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        python -c "
        import os
        import pychrony
        expected = os.environ['VERSION']
        print(f'Installed version: {pychrony.__version__}')
        assert pychrony.__version__ == expected, \
            f'Version mismatch: {pychrony.__version__} != {expected}'
        "
