name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never cancel a release in progress: a half-finished run can leave Test PyPI
# holding a version that production PyPI never gets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Required for hatch-vcs versioning
        submodules: recursive  # Required for vendor/libchrony
        persist-credentials: false

    - name: Build wheels with cibuildwheel
      uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
      with:
        extras: uv
      env:
        CIBW_ARCHS_LINUX: ${{ matrix.arch }}

    - name: Upload wheel artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wheels-${{ matrix.arch }}
        path: wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Required for hatch-vcs versioning
        persist-credentials: false

    - name: Install UV
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        # The sdist ships to PyPI, so it must not build from a cache that a PR
        # run could have written.
        enable-cache: false

    - name: Build sdist
      run: uv build --sdist

    - name: Upload sdist artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sdist
        path: dist/*.tar.gz

  # Run the integration suite against the x86_64 wheels this run built, in the
  # chronyd container, before anything is published. The image installs the
  # wheel matching its python3 (Fedora's) from the wheelhouse and fails if
  # there is none, so a missing wheel cannot pass as a skipped run.
  integration-test-wheel:
    name: Integration tests (wheel)
    needs: build-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive  # Required for vendor/libchrony
        persist-credentials: false

    - name: Download x86_64 wheels
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: wheels-x86_64
        path: wheelhouse/

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # No gha cache here: like the sdist build, a release must not build from a
    # cache that a PR run could have written.
    - name: Build Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: docker/Dockerfile.test
        tags: pychrony-test:latest
        load: true
        build-args: PYCHRONY_INSTALL=wheel
        build-contexts: wheelhouse=wheelhouse

    - name: Run tests
      run: docker run --rm --cap-add=SYS_TIME pychrony-test:latest run-integration.sh

  publish-testpypi:
    name: Publish to Test PyPI
    needs: [build-wheels, build-sdist, integration-test-wheel]
    runs-on: ubuntu-latest
    environment: testpypi
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # OIDC token for Test PyPI Trusted Publishing

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist/
        merge-multiple: true

    - name: Publish to Test PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify Test PyPI (${{ matrix.python }})
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.14t", "3.15"]

    steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python }}
        allow-prereleases: true

    - name: Extract version from tag
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Install from Test PyPI
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # --no-cache-dir is load-bearing. The simple index is served with
        # `cache-control: max-age=600`, so pip stores the first response for ten
        # minutes; without this flag every later attempt replays the same stale
        # index from disk and the retry loop cannot outlast Test PyPI's CDN lag.
        for i in $(seq 1 10); do
          if pip install --no-cache-dir \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "pychrony==$VERSION"; then
            echo "Installed on attempt $i"
            exit 0
          fi
          if [ "$i" -lt 10 ]; then
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          fi
        done
        echo "::error::pychrony==$VERSION never became installable from Test PyPI"
        exit 1

    - name: Verify import and version
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        python -c "
        import os
        import pychrony
        expected = os.environ['VERSION']
        print(f'Installed version: {pychrony.__version__}')
        assert pychrony.__version__ == expected, \
            f'Version mismatch: {pychrony.__version__} != {expected}'
        "

    # On a free-threaded interpreter, prove the cp3XXt wheel was installed
    # (not the sdist, which has no compiled bindings) and that importing it
    # leaves the GIL disabled.
    - name: Verify free-threaded wheel
      if: endsWith(matrix.python, 't')
      run: |
        python -c "
        import sys
        import pychrony._core._cffi_bindings
        assert not sys._is_gil_enabled(), 'importing pychrony re-enabled the GIL'
        print('GIL disabled after import')
        "

  # Production publish lives in this workflow, after verification, so it can
  # only ever upload the artifacts this tag-push run built and Test PyPI served.
  # The `pypi` environment's required reviewer gates it. To retry a failed
  # publish, re-run this job from the Release run.
  publish-pypi:
    name: Publish to Production PyPI
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # OIDC token for PyPI Trusted Publishing

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist/
        merge-multiple: true

    - name: List artifacts
      run: ls -la dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
