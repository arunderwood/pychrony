name: Documentation

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        # `mike deploy --push` pushes gh-pages with these credentials. This job
        # uploads no artifacts, so nothing carries them off the runner.
        persist-credentials: true

    - name: Install UV
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        # A deploy job must not restore a cache that a PR run could have written.
        enable-cache: false
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --group docs

    # Gate the deploy on a strict build. `mike deploy` builds internally, but
    # without --strict, so broken links or mkdocstrings resolution failures
    # would publish a degraded site instead of failing. Runs before any git
    # mutation so a bad build never touches gh-pages.
    - name: Verify documentation builds
      run: uv run mkdocs build --strict

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Deploy main docs
      if: github.ref == 'refs/heads/main'
      run: uv run mike deploy --push main

    - name: Deploy versioned docs
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        uv run mike deploy --push --update-aliases "$VERSION" latest
        uv run mike set-default --push latest
